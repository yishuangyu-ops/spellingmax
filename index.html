<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拼字學習機 V8.4 (動詞三態特訓版)</title>
    
    <style>
        :root {
            --primary: #FFD54F; --secondary: #4FC3F7; --accent: #FF7043; 
            --bg: #FFF9C4; --text: #37474F; --success: #66BB6A; --error: #EF5350;
            --sent-bg: #E0F7FA; --root-bg: #E8F5E9; --root-text: #2E7D32;
            --forms-bg: #EDE7F6; --forms-text: #5E35B1;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Comic Sans MS', '微軟正黑體', sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .noselect { -webkit-user-select: none; user-select: none; }

        header {
            width: 100%; background: var(--primary); padding: 10px 15px;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .header-title { font-size: 1.2rem; font-weight: bold; color: #5D4037; }

        .controls-row { display: flex; justify-content: center; align-items: center; gap: 8px; width:100%; padding: 10px; background: #fff8e1; flex-wrap: wrap;}
        select { padding: 8px; border-radius: 20px; border: 2px solid #ddd; font-size: 0.95rem; background: white; max-width: 200px; outline: none; }
        
        .mistake-btn {
            background: #F48FB1; color: white; border: none; padding: 8px 15px; 
            border-radius: 20px; font-weight: bold; font-size: 0.95rem; 
            cursor: pointer; box-shadow: 0 2px 5px rgba(224, 64, 112, 0.3);
            transition: transform 0.1s;
        }
        .mistake-btn:active { transform: scale(0.95); }

        .tabs { display: flex; width: 95%; max-width: 600px; margin: 10px auto; background: rgba(255,255,255,0.7); border-radius: 30px; padding: 5px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px 4px; border: none; background: transparent; cursor: pointer; font-weight: bold; font-size: 0.95rem; border-radius: 25px; color: #90A4AE; white-space: nowrap; }
        .tab-btn.active { background: var(--secondary); color: white; box-shadow: 0 3px 6px rgba(3, 155, 229, 0.3); }

        #game-area {
            width: 95%; max-width: 600px; background: white; border-radius: 25px; padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; margin-bottom: 20px;
            min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }

        .big-word { font-size: 3rem; font-weight: bold; margin: 15px 0; letter-spacing: 1px; cursor: pointer; word-break: break-word; }
        .big-word:active { transform: scale(0.95); }
        .syllable-display { font-size: 1.5rem; color: #90A4AE; margin-bottom: 5px; height: 30px; font-family: monospace; }
        .chinese { font-size: 1.5rem; margin-top: 5px; color: #546E7A; font-weight: bold; }

        .forms-tag {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--forms-bg); color: var(--forms-text);
            padding: 8px 18px; border-radius: 20px; margin-top: 12px;
            font-size: 1.05rem; font-weight: bold; cursor: pointer;
            border: 2px solid #D1C4E9; transition: transform 0.1s;
        }
        .forms-tag:active { transform: scale(0.96); }

        .sentence-tag {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--sent-bg); color: #006064;
            padding: 10px 20px; border-radius: 25px; margin-top: 10px;
            font-size: 1rem; font-style: italic; cursor: pointer;
            transition: all 0.2s; max-width: 100%; text-align: left; line-height: 1.4;
        }
        .sentence-tag:active { transform: scale(0.98); background: #fff; }

        .root-tag {
            display: none; background: var(--root-bg); color: var(--root-text);
            padding: 8px 15px; border-radius: 15px; margin-top: 8px;
            font-size: 0.95rem; border: 1px dashed var(--root-text);
        }
        .root-btn {
            background: none; border: none; color: var(--root-text);
            font-size: 0.9rem; cursor: pointer; text-decoration: underline; margin-top: 8px;
        }

        .letter-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 20px 0; min-height: 60px; }
        .slot { width: 40px; height: 45px; border-bottom: 4px solid #E0E0E0; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; }
        .slot.filled { border-bottom-color: var(--secondary); }
        .slot.space { border-bottom: none; width: 15px; }
        
        .scramble-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
        .block-btn { width: 50px; height: 50px; background: var(--primary); border: none; border-radius: 12px; font-size: 1.6rem; font-weight: bold; box-shadow: 0 4px 0 #FFC107; cursor: pointer; }
        .block-btn:active { transform: translateY(4px); box-shadow: none; }
        .block-btn:disabled { opacity: 0; pointer-events: none; }
        
        .input-box { font-size: 1.8rem; padding: 10px; width: 90%; text-align: center; border: 3px solid var(--secondary); border-radius: 15px; outline: none; margin: 20px 0; background: #FAFAFA; }

        /* 動詞三態測驗區 */
        .forms-quiz-group { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; margin: 15px 0; }
        .forms-input-row { display: flex; flex-direction: column; align-items: flex-start; width: 100%; }
        .forms-label { font-size: 0.9rem; font-weight: bold; color: var(--forms-text); margin-bottom: 4px; margin-left: 8px; }
        .forms-input {
            width: 100%; font-size: 1.5rem; padding: 10px 14px; text-align: center;
            border: 3px solid #B39DDB; border-radius: 15px; outline: none; background: #FAFAFA;
            transition: border-color 0.2s, background 0.2s;
        }
        .forms-input:focus { border-color: var(--forms-text); background: #fff; }

        .nav-controls { display: flex; justify-content: space-around; align-items: center; width: 100%; margin-top: auto; padding-top: 25px; flex-wrap: wrap; gap: 10px; }
        .action-btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 50px; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 #D84315; font-weight: bold; }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-undo { background: #FFB74D; box-shadow: 0 4px 0 #F57C00; }
        .btn-reset { background: #B0BEC5; box-shadow: 0 4px 0 #78909C; }
        .speak-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 26px; background: var(--secondary); box-shadow: 0 5px 0 #0288D1; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; color: white; }
        .speak-btn:active { transform: translateY(4px); box-shadow: none; }

        .hint-section { margin-top: 10px; min-height: 40px; display: flex; flex-direction: column; align-items: center; }
        .hint-btn { background: #F3E5F5; color: #7B1FA2; border: none; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        .hint-btn:active { transform: translateY(2px); box-shadow: none; }
        .answer-reveal { margin-top: 5px; font-size: 1.35rem; font-weight: bold; color: var(--error); letter-spacing: 1px; min-height: 28px; }

        #emergency-reset { position: fixed; bottom: 10px; left: 10px; font-size: 12px; opacity: 0.7; z-index: 9999; text-decoration: underline; cursor: pointer; color: #d32f2f; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 4px; }
        
        .feedback { font-size: 1.3rem; height: 30px; margin-bottom: 5px; font-weight: bold; }
        .progress-indicator { position: absolute; top: 15px; right: 20px; font-size: 0.9rem; color: #B0BEC5; font-weight: bold; }
        
        .vowel { color: var(--vowel); } .consonant { color: var(--consonant); }
        @keyframes pop { 50% {transform: scale(1.2);} }
        .anim-pop { animation: pop 0.3s; color: var(--success); }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .anim-shake { animation: shake 0.4s; color: var(--error); }
    </style>
</head>
<body>

<header class="noselect">
    <div class="header-title">🐝 Spelling Bee V8.4 (動詞三態特訓版)</div>
</header>

<div class="controls-row noselect">
    <select id="levelSelect" onchange="changeLevel()"></select>
    <select id="voiceSelect" onchange="setVoice()"><option>Loading...</option></select>
    <button id="mistake-btn" class="mistake-btn" onclick="loadMistakes()">🏥 錯題本 (0)</button>
</div>

<div class="tabs noselect">
    <button class="tab-btn active" onclick="switchMode('study')" id="tab-study">👀 學習</button>
    <button class="tab-btn" onclick="switchMode('block')" id="tab-block">🧩 拼圖</button>
    <button class="tab-btn" onclick="switchMode('dictation')" id="tab-dictation">✍️ 聽寫</button>
    <button class="tab-btn" onclick="switchMode('forms')" id="tab-forms">🔄 三態</button>
</div>

<div id="game-area">
    <div style="padding:20px; color:#2980b9; font-weight:bold; font-size:1.2rem;">
        ☁️ 正在與 Google 雲端連線同步資料...
    </div>
</div>

<div id="emergency-reset" onclick="hardReset()">⚠️ 清除本機錯題紀錄</div>

<script>
    window.onerror = function(msg) { console.error(msg); return false; };

    // ==========================================
    // ⚠️ 老師請注意：把您的 Google 試算表 CSV 網址貼在下方的雙引號中
    // ==========================================
    const SHEET_CSV_URL = "請把你的 Google 表單 CSV 網址貼在這裡";
    
    const fallbackData = `
# 雲端連線教學
eat=eat=吃=I ate an apple yesterday.=無=eat, ate, eaten
write=write=寫=She has written three letters.=無=write, wrote, written
cloud=cloud=雲端=The data is saved in the cloud.=無
success=suc-cess=成功=We achieved great success.=suc(下面) + cess(走)
`;

    let allWords = [];
    let currentLevelWords = [];
    let currentIndex = 0;
    let currentMode = 'study';
    let currentVoice = null;
    let isSyllableShown = false;
    let blockHistory = [];
    const synth = window.speechSynthesis;
    const MISTAKE_KEY = 'spelling_bee_v8_mistakes';

    window.hardReset = function() {
        if(confirm("確定要清除這台裝置的「錯題本」紀錄嗎？(雲端單字庫不受影響)")) { 
            localStorage.removeItem(MISTAKE_KEY);
            location.reload(); 
        }
    };

    setTimeout(async function() {
        try { 
            await loadDataFromCloud(); 
            initVoices(); 
            updateMistakeCount(); 
        } 
        catch(e) { 
            console.error(e); 
            document.getElementById('game-area').innerHTML='<div style="color:red; padding:20px;">載入發生錯誤，請重新整理網頁。</div>'; 
        }
    }, 100);

    async function loadDataFromCloud() {
        if(SHEET_CSV_URL === "請把你的 Google 表單 CSV 網址貼在這裡" || SHEET_CSV_URL.trim() === "") {
            parseAndSetData(fallbackData.trim());
            return;
        }

        try {
            const response = await fetch(SHEET_CSV_URL);
            if (!response.ok) throw new Error("Google 試算表連線失敗");
            const text = await response.text();
            parseAndSetData(text);
        } catch (error) {
            console.error(error);
            alert("⚠️ 無法讀取 Google 試算表。請確認網址是否正確，且已經「發布到網路」。\n\n系統暫時切換至備用模式。");
            parseAndSetData(fallbackData.trim());
        }
    }

    function parseAndSetData(text) {
        allWords = [];
        let currentUnitName = "未分類單字"; 
        
        const lines = text.split('\n');
        lines.forEach(line => {
            line = line.trim();
            if(line === '') return;
            
            if (!line.includes('=')) {
                if (line.includes('#')) {
                    currentUnitName = line.split('#')[1].replace
